[package]
name = "hark"
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
description = "Local CLI and per-user daemon for connecting an agent to cbcl-router"
license = "Apache-2.0"

[[bin]]
name = "hark"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
# IMPL-025: pinned to the role-layer cbcl-rs at fd8f034 (epp `febc669` + the mls-ds
# commits), the ADR-021 pin recommendation. `mls-ds-proof` compiles the DomainTuple
# crypto + strict Ed25519 the client consumes.
# PROVISIONAL PIN: fd8f034 is the tip of the fix/mls-ds-quoted-hash-depth branch on
# the cbcl-rs remote, NOT yet merged to cbcl-rs main. Move `rev` to the merged/tagged
# commit once the role layer lands (closes IMPL-024 ADR-021).
cbcl-core = { git = "https://codeberg.org/anuna/cbcl-rs", rev = "fd8f034", features = ["mls-ds-proof"] }
cbcl-parser = { git = "https://codeberg.org/anuna/cbcl-rs", rev = "fd8f034" }
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
config = "0.15"
curve25519-dalek = { version = "4", features = ["digest"] }
directories = "6.0"
ed25519-dalek = "2"
fs2 = "0.4"
futures-util = "0.3"
hkdf = "0.12"
hmac = "0.12"
# SPEC-013 ADR-003 / BK-3: version-pinned to the crate the web client builds
# against, exact — an unlocked `cargo update` on either side would otherwise let
# the MLS wire behaviour silently diverge across the hark/web boundary (NFR-001).
openmls = "=0.8.1"
openmls_basic_credential = "=0.5.0"
openmls_rust_crypto = "=0.5.1"
openmls_traits = "=0.5.0"
tls_codec = "0.4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.44", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
clap_mangen = "0.2"
predicates = "3.1"
proptest = "1"
tempfile = "3.16"
tokio = { version = "1.44", features = ["test-util"] }
