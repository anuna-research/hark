[package]
name = "hark"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local CLI and daemon client for cbcl-router agent connections"
license = "Apache-2.0"

[[bin]]
name = "hark"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
cbcl-core = { path = "../cbcl-rs/crates/cbcl-core" }
cbcl-parser = { path = "../cbcl-rs/crates/cbcl-parser" }
clap = { version = "4.5", features = ["derive", "env"] }
config = "0.15"
directories = "6.0"
fs2 = "0.4"
futures-util = "0.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.44", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.16"
tokio = { version = "1.44", features = ["test-util"] }
