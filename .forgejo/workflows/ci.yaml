#
# hark CI gate (Forgejo Actions). Runs the same checks the release script gates
# on locally — `cargo clippy -D warnings` and `cargo test` — on every push to
# main and every pull request, so a clippy/compile/test regression is caught in
# review instead of when ./release.sh is run.
#
# Like the release pipeline, this clones the sibling cbcl-rs path dependency
# (public on git.anuna.io) and pins it to CBCL_RS_REF: `--locked` cannot pin
# path-dependency *contents*, so CI must build against the same pinned commit a
# release would. Keep CBCL_RS_REF in sync with .forgejo/workflows/release.yaml.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CBCL_RS_REF: 1c6fa8f581a69a7bcb88fb787fa37c81f5de4221

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone + pin the cbcl-rs path dependency
        run: |
          if [ ! -d ../cbcl-rs ]; then
            git clone https://git.anuna.io/anuna-research/cbcl-rs.git ../cbcl-rs
          fi
          git -C ../cbcl-rs checkout --detach "$CBCL_RS_REF"

      - name: Ensure Rust toolchain (clippy)
        # The Forgejo runner image ships node/git/curl but NOT rustup, and may
        # lack a C toolchain (ring compiles a little C/asm). Install both if
        # absent; appending to $GITHUB_PATH exposes cargo to later steps.
        run: |
          SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO="sudo"
          if ! command -v cc >/dev/null 2>&1; then
            $SUDO apt-get update && $SUDO apt-get install -y build-essential pkg-config curl
          fi
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup component add clippy
          rustc --version
          cargo --version
          cargo clippy --version

      # Cache the DEPENDENCY SOURCES only — deliberately not `target`.
      #
      # `target` was cached here too, and it is what filled the runner's disk.
      # A hark debug build is ~6.2 GB (3.2 GB of it `target/debug/deps`, across
      # 24 test binaries) against ~1.5 GB for the registry, and the key is
      # per-Cargo.lock — so every distinct lockfile minted another multi-gigabyte
      # entry and the old ones stayed. The failure is not a clean "cache full"
      # either: `tar` dies part-way through restoring `target/debug/deps/…` with
      # ENOSPC, the step continues against a HALF-RESTORED target, and the build
      # then fails with errors that point at the wrong thing entirely —
      # `can't find crate for rand_core`, `could not compile crypto-common` —
      # sending the reader after a dependency problem that does not exist.
      #
      # The registry is the part worth keeping: it is bounded, it is what the
      # network time actually goes on, and it is reusable across lockfiles. A
      # cold `target` costs compile time on every run; that is the trade, and a
      # slower green run beats a fast red one that blames the wrong crate.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # The prefix is versioned (`-v2-`) so this never restores one of the
          # OLD entries, which were archived WITH `target` in them: `restore-keys`
          # is a prefix match, so leaving it unchanged would let a stale
          # multi-gigabyte entry come back and re-fill the disk the moment a
          # lockfile missed the exact key. Bump it again if the cached set ever
          # changes shape.
          key: ${{ runner.os }}-cargo-ci-v2-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-v2-

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
